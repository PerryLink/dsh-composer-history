<rect x="176" y="124" width="116" height="34" rx="10" fill="#f4f7fd" stroke="#d6dded" stroke-width="1"/><text x="234.0" y="146.04" font-size="14" fill="#2f3750" font-family="'Consolas','Cascadia Mono',monospace" text-anchor="middle">↓ ArrowDown</text>
<rect x="300" y="124" width="49" height="34" rx="10" fill="#f4f7fd" stroke="#d6dded" stroke-width="1"/><text x="324.5" y="146.04" font-size="14" fill="#2f3750" font-family="'Consolas','Cascadia Mono',monospace" text-anchor="middle">Esc</text>
<rect x="357" y="124" width="74" height="34" rx="10" fill="#eef1fa" stroke="#d6dded" stroke-width="1"/><text x="394.0" y="146.04" font-size="14" fill="#4B67B4" font-family="'Consolas','Cascadia Mono',monospace" text-anchor="middle">Ctrl+R</text>
<text x="443" y="146" font-size="16" fill="#8a93a8" font-family="'Microsoft YaHei','Segoe UI',sans-serif">→</text>
<text x="462" y="116" font-size="14" fill="#8a93a8" font-family="'Consolas','Cascadia Mono',monospace" font-weight="700" letter-spacing="0.5">GATE · any miss → pass (event untouched)</text>
<rect x="462" y="124" width="115" height="34" rx="10" fill="#eef1fa" stroke="#d6dded" stroke-width="1"/><text x="519.5" y="146.04" font-size="14" fill="#4B67B4" font-family="'Microsoft YaHei','Segoe UI',sans-serif" text-anchor="middle">phase = plain</text>
<rect x="585" y="124" width="136" height="34" rx="10" fill="#f4f7fd" stroke="#d6dded" stroke-width="1"/><text x="653.0" y="146.04" font-size="14" fill="#2f3750" font-family="'Microsoft YaHei','Segoe UI',sans-serif" text-anchor="middle">menuOpen = false</text>
<rect x="729" y="124" width="150" height="34" rx="10" fill="#f4f7fd" stroke="#d6dded" stroke-width="1"/><text x="804.0" y="146.04" font-size="14" fill="#2f3750" font-family="'Microsoft YaHei','Segoe UI',sans-serif" text-anchor="middle">no IME / selection</text>
<rect x="887" y="124" width="143" height="34" rx="10" fill="#f4f7fd" stroke="#d6dded" stroke-width="1"/><text x="958.5" y="146.04" font-size="14" fill="#2f3750" font-family="'Microsoft YaHei','Segoe UI',sans-serif" text-anchor="middle">no Alt/Meta/Shift</text>
