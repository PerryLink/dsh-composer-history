<rect width="1100" height="660" fill="url(#bg)"/>
<text x="48" y="54" font-size="22" fill="#1b2233" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-weight="700">DraftRecall state machine</text>
<text x="1052" y="54" font-size="14" fill="#8a93a8" font-family="'Consolas','Cascadia Mono',monospace" text-anchor="end">dsh-composer-history · v0.8.16</text>
<text x="48" y="82" font-size="14" fill="#5a6275" font-family="'Microsoft YaHei','Segoe UI',sans-serif">keydown → gate → transition → single write path (setDraft); recall edits the draft, only Enter sends</text>
