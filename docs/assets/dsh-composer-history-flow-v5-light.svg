<path d="M810 172V232" stroke="#4B67B4" stroke-width="2" marker-end="url(#arr-acc)"/>
<text x="302" y="196" font-size="14" fill="#8a93a8" font-family="'Microsoft YaHei','Segoe UI',sans-serif">same gate · both states</text>
<rect x="150" y="240" width="280" height="190" rx="20" fill="#ffffff" stroke="#d6dded" stroke-width="1" filter="url(#soft)"/>
<text x="176" y="284" font-size="22" fill="#4B67B4" font-family="'Consolas','Cascadia Mono',monospace" font-weight="700" letter-spacing="1">IDLE</text>
<text x="176" y="308" font-size="14" fill="#5a6275" font-family="'Microsoft YaHei','Segoe UI',sans-serif">not browsing · no stash</text>
<text x="176" y="340" font-size="14" fill="#8a93a8" font-family="'Microsoft YaHei','Segoe UI',sans-serif">·</text>
<text x="190" y="340" font-size="14" fill="#2f3750" font-family="'Microsoft YaHei','Segoe UI',sans-serif">↓ always passes</text>
<text x="176" y="366" font-size="14" fill="#8a93a8" font-family="'Microsoft YaHei','Segoe UI',sans-serif">·</text>
<text x="190" y="366" font-size="14" fill="#2f3750" font-family="'Microsoft YaHei','Segoe UI',sans-serif">↑ off line 1 → pass</text>
<text x="176" y="392" font-size="14" fill="#8a93a8" font-family="'Microsoft YaHei','Segoe UI',sans-serif">·</text>
<text x="190" y="392" font-size="14" fill="#2f3750" font-family="'Microsoft YaHei','Segoe UI',sans-serif">↑ line 1 + history → browse</text>
<text x="176" y="418" font-size="14" fill="#8a93a8" font-family="'Microsoft YaHei','Segoe UI',sans-serif">·</text>
<text x="190" y="418" font-size="14" fill="#2f3750" font-family="'Microsoft YaHei','Segoe UI',sans-serif">session switch → reset</text>
<rect x="660" y="240" width="300" height="216" rx="20" fill="#ffffff" stroke="#d6dded" stroke-width="1" filter="url(#soft)"/>
<text x="686" y="284" font-size="22" fill="#4B67B4" font-family="'Consolas','Cascadia Mono',monospace" font-weight="700" letter-spacing="0.5">BROWSING</text>
<text x="686" y="308" font-size="14" fill="#5a6275" font-family="'Microsoft YaHei','Segoe UI',sans-serif">index · savedDraft · savedCaret</text>
<rect x="680" y="322" width="260" height="24" rx="8" fill="#f4f7fd"/>
<text x="694" y="339" font-size="14" fill="#8a93a8" font-family="'Consolas','Cascadia Mono',monospace">E0</text>
<text x="730" y="339" font-size="14" fill="#5a6275" font-family="'Microsoft YaHei','Segoe UI',sans-serif">oldest</text>
<rect x="680" y="350" width="260" height="24" rx="8" fill="#eef1fa" stroke="#4B67B4" stroke-width="1.4"/>
<text x="694" y="367" font-size="14" fill="#4B67B4" font-family="'Consolas','Cascadia Mono',monospace">E1</text>
<text x="928" y="367" font-size="14" fill="#4B67B4" font-family="'Consolas','Cascadia Mono',monospace" text-anchor="end">index</text>
<rect x="680" y="378" width="260" height="24" rx="8" fill="#f4f7fd"/>
<text x="694" y="395" font-size="14" fill="#8a93a8" font-family="'Consolas','Cascadia Mono',monospace">E2</text>
<text x="730" y="395" font-size="14" fill="#5a6275" font-family="'Microsoft YaHei','Segoe UI',sans-serif">…</text>
<rect x="680" y="406" width="260" height="24" rx="8" fill="#f4f7fd"/>
<text x="694" y="423" font-size="14" fill="#8a93a8" font-family="'Consolas','Cascadia Mono',monospace">E3</text>
<text x="730" y="423" font-size="14" fill="#5a6275" font-family="'Microsoft YaHei','Segoe UI',sans-serif">newest</text>
<text x="686" y="450" font-size="14" fill="#5a6275" font-family="'Microsoft YaHei','Segoe UI',sans-serif">↑ older · at index 0 → hold</text>
<path d="M430 300H654" stroke="#4B67B4" stroke-width="2.5" marker-end="url(#arr-acc)"/>
<text x="438" y="280" font-size="14" fill="#4B67B4" font-family="'Microsoft YaHei','Segoe UI',sans-serif">↑ first line · history ≠ ∅</text>
<text x="438" y="324" font-size="14" fill="#5a6275" font-family="'Consolas','Cascadia Mono',monospace">stash {draft, caret}</text>
<text x="438" y="344" font-size="14" fill="#5a6275" font-family="'Consolas','Cascadia Mono',monospace">fill(newest) → setDraft</text>
<path d="M654 390H436" stroke="#15803d" stroke-width="2.5" marker-end="url(#arr-grn)"/>
<text x="438" y="414" font-size="14" fill="#15803d" font-family="'Microsoft YaHei','Segoe UI',sans-serif">↓ last line / Esc</text>
<text x="438" y="434" font-size="14" fill="#5a6275" font-family="'Microsoft YaHei','Segoe UI',sans-serif">restore savedDraft + caret</text>
<rect x="48" y="470" width="632" height="146" rx="20" fill="#ffffff" stroke="#d6dded" stroke-width="1" filter="url(#soft)"/>
<text x="70" y="496" font-size="14" fill="#8a93a8" font-family="'Consolas','Cascadia Mono',monospace" font-weight="700" letter-spacing="1">EFFECT · STORAGE</text>
<text x="70" y="522" font-size="14" fill="#2f3750" font-family="'Microsoft YaHei','Segoe UI',sans-serif">history[] = session + persisted + workspace + [compacted]</text>
<text x="70" y="544" font-size="14" fill="#2f3750" font-family="'Microsoft YaHei','Segoe UI',sans-serif">fill / restore → setDraft(text) — the only write path</text>
<text x="70" y="566" font-size="14" fill="#2f3750" font-family="'Microsoft YaHei','Segoe UI',sans-serif">lands in the ordinary composer draft · Enter is still yours</text>
<text x="70" y="588" font-size="14" fill="#5a6275" font-family="'Consolas','Cascadia Mono',monospace">localStorage ×4 · history.v1 · snippets.v1 · templates.v1 · insights.v1</text>
<text x="70" y="608" font-size="14" fill="#5a6275" font-family="'Consolas','Cascadia Mono',monospace">bounded · schemaVersion 1 · Export JSON / Import file · no network</text>
<path d="M1040 172V460" stroke="#8a93a8" stroke-width="1.6" stroke-dasharray="6 6" marker-end="url(#arr-fnt)"/>
<text x="1028" y="200" font-size="14" fill="#8a93a8" font-family="'Microsoft YaHei','Segoe UI',sans-serif" text-anchor="end">bypasses states</text>
<rect x="700" y="470" width="352" height="146" rx="20" fill="#ffffff" stroke="#d6dded" stroke-width="1" filter="url(#soft)"/>
<text x="720" y="496" font-size="15" fill="#4B67B4" font-family="'Consolas','Cascadia Mono',monospace" font-weight="700" letter-spacing="0.5">Ctrl+R · PARALLEL LANE</text>
<text x="720" y="522" font-size="14" fill="#5a6275" font-family="'Consolas','Cascadia Mono',monospace">machine.reset() → openSearch()</text>
<text x="720" y="544" font-size="14" fill="#2f3750" font-family="'Microsoft YaHei','Segoe UI',sans-serif">sources: history · snippets</text>
<text x="720" y="566" font-size="14" fill="#2f3750" font-family="'Microsoft YaHei','Segoe UI',sans-serif">templates · [compacted]</text>
<text x="720" y="588" font-size="14" fill="#5a6275" font-family="'Consolas','Cascadia Mono',monospace">actions: Export / Copy / Import JSON</text>
<text x="720" y="608" font-size="14" fill="#5a6275" font-family="'Consolas','Cascadia Mono',monospace">pick → fill · Esc cancels</text>
