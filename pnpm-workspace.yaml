# Plugin-local workspace root: keeps pnpm inside this directory instead of
# walking up to the harness monorepo, and reviews esbuild's build script.
packages:
  - .
allowBuilds:
  esbuild: true
# The dev/test pins ride the 0.1.7-alpha.1 line. The self-referential rows are
# load-bearing: pnpm matches a prerelease range only against its own
# [major, minor, patch] tuple, so a transitive peer asking for
# `^0.1.7-alpha.1` would otherwise resolve SEPARATELY from this package's own
# `0.1.7-alpha.1` devDeps. That installs a second copy of the host type graph,
# and this package's types then disagree with the host's (surfacing as
# spurious `X incorrectly extends Y` errors). Mirroring each devDep pin keeps
# exactly one copy of every host package.
#
# `cordis`, `cosmokit` and `schemastery` are BARE peer edges in the dependency
# graph, so a range-qualified row never matches them — they need package-name
# overrides. The floors are load-bearing: `Volatile` is exported only from
# cordis 4.0.3+ (re-exported from cosmokit 1.8.4+), `Schema.prototype.volatile`
# arrives with schemastery 3.18.3, and a lockfile that already resolved the
# older patch keeps resolving to it under the nominal ranges.
overrides:
  '@deepseek-ai/cordis': 4.0.3
  '@deepseek-ai/cosmokit': 1.8.4
  '@deepseek-ai/schemastery': 3.18.3
  '@deepseek-ai/dsh-api-remotes@^0.1.7-alpha.1': 0.1.7-alpha.1
  '@deepseek-ai/dsh-attachment@^0.1.7-alpha.1': 0.1.7-alpha.1
  '@deepseek-ai/dsh-client-ui-conversation@^0.1.7-alpha.1': 0.1.7-alpha.1
  '@deepseek-ai/dsh-client-ui-input-trigger@^0.1.7-alpha.1': 0.1.7-alpha.1
  '@deepseek-ai/dsh-client-ui-settings@^0.1.7-alpha.1': 0.1.7-alpha.1
  '@deepseek-ai/dsh-settings@^0.1.7-alpha.1': 0.1.7-alpha.1
# Wildcard only, on purpose — the same single row every 0.1.7-line sibling
# repo carries. The per-version rows this file used to list alongside it
# (`@deepseek-ai/cordis@4.0.1`, `@deepseek-ai/cosmokit@1.8.2|1.8.3`,
# `@deepseek-ai/schemastery@3.18.1|3.18.2`) are what stalled the lockfile
# supply-chain check: with a name carrying exact-version rows, pnpm 11.7.0 and
# 11.21.0 both stop applying the wildcard to that name, and the exact
# comparison then misses the peer-suffixed key the lockfile records — so
# `pnpm install` failed with ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION on
# `@deepseek-ai/cordis@4.0.3`, `@deepseek-ai/cosmokit@1.8.4` and
# `@deepseek-ai/schemastery@3.18.3` (measured: dropping the stale rows, or
# listing only the resolved versions, clears all three).
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
verifyDepsBeforeRun: false
