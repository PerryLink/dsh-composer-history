name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test
      - run: pnpm run test:coverage
      - run: pnpm run check:readmes
      - run: pnpm run verify:pack
      # OIDC only: `id-token: write` above lets pnpm/npm exchange a short-lived
      # credential via trusted publishing. Supplying NODE_AUTH_TOKEN here would make
      # npm take the token path instead, and with the token now rejected the run
      # fails to authenticate without ever attempting the exchange.
      - run: pnpm publish --no-git-checks --provenance
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
